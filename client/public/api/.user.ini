; PHP-FPM hosts honor .user.ini per directory even when .htaccess
; php_value directives are blocked. These limits effectively remove the
; upload cap for the admin panel.
upload_max_filesize = 4096M
post_max_size = 4200M
memory_limit = 512M
max_execution_time = 3600
max_input_time = 3600
max_file_uploads = 50
