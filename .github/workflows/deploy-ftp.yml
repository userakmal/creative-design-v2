name: Deploy via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install client dependencies
        run: cd client && npm install --no-audit --no-fund

      - name: Build React app
        run: cd client && npm run build

      # Vite outputs to ./dist (see client/vite.config.ts → build.outDir).
      # client/public/* (including api/*.php, .htaccess, data/) is copied
      # into dist/ during the build, so the single dist/ directory contains
      # everything that needs to ship — React SPA + PHP backend.

      # Hosting is nginx-fronted and doesn't honor .htaccess SPA fallback,
      # so deep links like /admin would 404. Materialise an index.html for
      # each React route so direct URL access serves the SPA shell and the
      # router takes over client-side. /music isn't listed because that
      # path is also the media folder for uploaded music files.
      # NOTE: 'websites' is intentionally excluded here. The Vite build
      # (client/vite.config.ts → copy-index-html-for-routes plugin) already
      # materialises dist/websites/index.html WITHOUT og:image/twitter:image
      # so the /websites link shows a text-only social preview (no photo).
      # A plain `cp` here would overwrite it and bring the image back.
      - name: Generate per-route index.html for SPA deep links
        run: |
          for route in admin templates popular custom video-downloader; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 31.184.242.14
          username: gihub-deploy
          password: ${{ secrets.FTP_PASSWORD || 'gM9aH7jD3c' }}
          local-dir: ./dist/
          server-dir: /
          # Preserve uploaded media + live JSON data on the server.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            videos/**
            image/**
            music/**
            data/*.json
